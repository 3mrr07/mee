<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1A433A">
  <title data-page-title="page.title.compare">قارن الأفرع | كلية الهندسة</title>
  <meta name="description" content="قارن بين الأفرع الهندسية السبعة في كلية الهندسة الميكانيكية والكهربائية">
  <link rel="icon" type="image/svg+xml" href="./img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=5">
  <link rel="manifest" href="./manifest.json">
</head>
<body data-page="compare">

  <!-- Top Bar -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="./" class="topbar-logo">
        <div class="logo-placeholder">H</div>
        <span data-i18n="nav.brand">كلية الهندسة الميكانيكية والكهربائية</span>
      </a>
      <div class="topbar-actions">
        <button id="theme-toggle" class="topbar-btn" onclick="toggleTheme()" aria-label="الوضع الليلي">&#9790;</button>
        <button id="lang-toggle" class="topbar-btn lang-toggle" onclick="toggleLanguage()" data-i18n="lang.label">EN</button>
      </div>
    </div>
  </header>

  <!-- Header -->
  <section class="dept-header" style="--dept-color: var(--color-primary)">
    <div class="container" style="position:relative;z-index:1">
      <a href="./" class="back-btn">&#8594; <span data-i18n="btn.back">العودة للرئيسية</span></a>
      <div class="dept-header-icon" style="--dept-color: var(--color-primary)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </div>
      <h1 data-i18n="compare.title">قارن بين فرعين</h1>
      <p data-i18n="compare.subtitle">اختر فرعين وقارن بينهما في كل الجوانب</p>
    </div>
  </section>

  <!-- Compare Section -->
  <section class="section" style="padding-top: var(--space-2xl)">
    <div class="container">

      <div class="compare-pickers">
        <div class="compare-picker-col">
          <div class="compare-picker-label" data-i18n="compare.select1">اختر الفرع الأول</div>
          <div class="compare-picker-row" id="picker-row-1"></div>
        </div>
        <div class="compare-vs"><div class="compare-vs-circle">VS</div></div>
        <div class="compare-picker-col">
          <div class="compare-picker-label" data-i18n="compare.select2">اختر الفرع الثاني</div>
          <div class="compare-picker-row" id="picker-row-2"></div>
        </div>
      </div>

      <div id="compare-msg"></div>
      <div id="compare-result"></div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p data-i18n="footer.line1">ملتقى وجهتك الأكاديمية 2026 - كلية الهندسة الميكانيكية والكهربائية - جامعة حمص</p>
      <p class="mt-sm" style="font-size:0.75rem" data-i18n="footer.line2">إعداد: اتحاد طلبة سوريا - فرع حمص</p>
    </div>
  </footer>

  <script src="./js/site-data.js?v=4"></script>
  <script src="./js/translations.js?v=4"></script>
  <script src="./js/i18n.js?v=4"></script>
  <script src="./js/main.js?v=4"></script>

</html>
